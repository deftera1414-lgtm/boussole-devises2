name: Boussole Devises — mise à jour horaire

on:
  schedule:
    # Toutes les heures, à la minute 15 (heure UTC). GitHub Actions n'exécute
    # pas toujours pile à l'heure sous forte charge — un léger retard (quelques
    # minutes) est normal et sans conséquence ici.
    - cron: "15 * * * *"
  workflow_dispatch: {}   # bouton "Run workflow" dans l'onglet Actions, pour tester à la demande

permissions:
  contents: write   # nécessaire pour que le workflow commit/push dashboard.html et currencies.json

concurrency:
  group: boussole-devises-update
  cancel-in-progress: false   # ne jamais interrompre un run en cours à mi-écriture

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Rafraîchir les chiffres (IPC, chômage) via FRED
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: python3 update_data.py

      - name: Reconstruire le dashboard
        run: python3 pipeline.py

      - name: Préparer la publication GitHub Pages
        run: |
          mkdir -p docs
          cp dashboard.html docs/index.html

      - name: Commit et push si quelque chose a changé
        run: |
          git config user.name "boussole-devises-bot"
          git config user.email "actions@users.noreply.github.com"
          git add currencies.json data.json docs/index.html
          if git diff --cached --quiet; then
            echo "Rien à committer (aucun changement détecté par update_data.py ou pipeline.py)."
          else
            git commit -m "Mise à jour automatique $(date -u +'%Y-%m-%d %H:%M UTC')"
            git push
          fi
