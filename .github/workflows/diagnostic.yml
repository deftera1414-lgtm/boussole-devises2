name: Diagnostic des sources officielles

# Execution manuelle uniquement. Interroge chaque source candidate et imprime
# ce qu'elle renvoie, sans rien ecrire dans le depot. Sert a verifier qu'une
# source repond depuis les serveurs de GitHub avant de la brancher au robot.

on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  diagnostic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Interroger les sources
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: |
          python3 - <<'PYEOF'
          import json, os, urllib.request, urllib.parse, urllib.error
          KEY = os.environ.get("FRED_API_KEY", "").strip()
          UA = {"User-Agent": "Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/126.0 Safari/537.36",
                "Accept": "*/*", "Accept-Language": "en-US,en;q=0.8"}

          def get(url, data=None, extra=None):
              h = dict(UA)
              if extra:
                  h.update(extra)
              rq = urllib.request.Request(url, data=data, headers=h)
              try:
                  with urllib.request.urlopen(rq, timeout=25) as r:
                      b = r.read()
                      return r.status, r.headers.get("Content-Type", ""), b
              except urllib.error.HTTPError as e:
                  return e.code, "", e.read()[:300]
              except Exception as e:
                  return 0, "", str(e).encode()

          def montre(nom, url, data=None, extra=None, tete=700, queue=500):
              st, ct, b = get(url, data, extra)
              t = b.decode("utf-8", "replace")
              print("=" * 100)
              print("## " + nom + "  ->  HTTP " + str(st) + "  " + ct + "  " + str(len(b)) + " octets")
              if tete:
                  print(t[:tete])
              if queue and len(t) > tete:
                  print("   [...]")
                  print(t[-queue:])
              print(flush=True)

          def fred(nom, sid, n=3):
              if not KEY:
                  print("## " + nom + " : pas de cle FRED"); return
              u = "https://api.stlouisfed.org/fred/series/observations?" + urllib.parse.urlencode(
                  {"series_id": sid, "api_key": KEY, "file_type": "json", "sort_order": "desc", "limit": n})
              st, ct, b = get(u)
              print("=" * 100)
              try:
                  obs = json.loads(b).get("observations", [])
                  print("## " + nom + " (" + sid + ") HTTP " + str(st) + " : " +
                        ", ".join(o["date"] + "=" + o["value"] for o in obs))
              except Exception as e:
                  print("## " + nom + " (" + sid + ") HTTP " + str(st) + " illisible " + str(e)[:80])
              u = "https://api.stlouisfed.org/fred/series?" + urllib.parse.urlencode(
                  {"series_id": sid, "api_key": KEY, "file_type": "json"})
              st, ct, b = get(u)
              try:
                  m = json.loads(b)["seriess"][0]
                  print("     " + m.get("title", "")[:90] + " | fin " + m.get("observation_end", "") +
                        " | maj " + m.get("last_updated", "") + " | " + m.get("frequency_short", ""))
              except Exception:
                  pass
              print(flush=True)

          import re, datetime as dt
          print("######## NASDAQ : noms des publications cles, septembre 2026 ########")
          PAYS = {"United States", "Euro Zone", "Germany", "United Kingdom", "Japan", "Switzerland",
                  "Canada", "Australia", "New Zealand"}
          CLE = re.compile(r"CPI|HICP|Unemployment|GDP|Interest Rate Decision|Deposit Facility|Employment Change|Nonfarm|Payrolls|Rate Statement|Cash Rate|Claimant|Retail Sales|ISM|Tankan|PCE", re.I)
          vus = {}
          d0 = dt.date(2026, 9, 1)
          for i in range(31):
              jour = (d0 + dt.timedelta(days=i)).isoformat()
              st, ct, b = get("https://api.nasdaq.com/api/calendar/economicevents?date=" + jour,
                              extra={"Accept": "application/json, text/plain, */*",
                                     "Origin": "https://www.nasdaq.com", "Referer": "https://www.nasdaq.com/"})
              try:
                  lignes = json.loads(b)["data"].get("rows") or []
              except Exception as e:
                  print("## " + jour + " illisible " + str(st)); continue
              for x in lignes:
                  if x.get("country") in PAYS and CLE.search(str(x.get("eventName", ""))):
                      print("   " + jour + " | " + " | ".join(str(x.get(k, "")).replace("&nbsp;", "").strip()
                            for k in ("gmt", "country", "eventName", "actual", "consensus", "previous")))
          print(flush=True)

          print("######## SNB fromDate ########")
          montre("SNB snbgwdzid fromDate", "https://data.snb.ch/api/cube/snbgwdzid/data/csv/en?fromDate=2026-09-20", tete=400, queue=300)
          print("######## BCE EXR historique ########")
          st, ct, b = get("https://data-api.ecb.europa.eu/service/data/EXR/D.USD+JPY+GBP+CHF+CAD+AUD+NZD.EUR.SP00.A?startPeriod=2025-02-01&format=csvdata")
          t = b.decode("utf-8", "replace").splitlines()
          print("## BCE EXR : HTTP " + str(st) + ", " + str(len(b)) + " octets, " + str(len(t)) + " lignes ; entete : " + (t[0][:200] if t else ""))
          print("   " + (t[1][:160] if len(t) > 1 else ""))
          print("   " + (t[-1][:160] if t else ""))
          print("######## BoJ API cible ########")
          montre("BoJ IR01", "https://www.stat-search.boj.or.jp/api/v1/getDataCode?format=json&lang=en&db=IR01&startDate=202608&code=MADR1Z@D", tete=700, queue=300)
          PYEOF
