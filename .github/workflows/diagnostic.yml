name: Diagnostic des sources officielles

# Execution manuelle uniquement. Interroge chaque source candidate et imprime
# ce qu'elle renvoie, sans rien ecrire dans le depot. Sert a verifier qu'une
# source repond depuis les serveurs de GitHub avant de la brancher au robot.

on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  diagnostic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Interroger les sources
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: |
          python3 - <<'PYEOF'
          import json, os, urllib.request, urllib.parse, urllib.error
          KEY = os.environ.get("FRED_API_KEY", "").strip()
          UA = {"User-Agent": "Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/126.0 Safari/537.36",
                "Accept": "*/*", "Accept-Language": "en-US,en;q=0.8"}

          def get(url, data=None, extra=None):
              h = dict(UA)
              if extra:
                  h.update(extra)
              rq = urllib.request.Request(url, data=data, headers=h)
              try:
                  with urllib.request.urlopen(rq, timeout=25) as r:
                      b = r.read()
                      return r.status, r.headers.get("Content-Type", ""), b
              except urllib.error.HTTPError as e:
                  return e.code, "", e.read()[:300]
              except Exception as e:
                  return 0, "", str(e).encode()

          def montre(nom, url, data=None, extra=None, tete=700, queue=500):
              st, ct, b = get(url, data, extra)
              t = b.decode("utf-8", "replace")
              print("=" * 100)
              print("## " + nom + "  ->  HTTP " + str(st) + "  " + ct + "  " + str(len(b)) + " octets")
              if tete:
                  print(t[:tete])
              if queue and len(t) > tete:
                  print("   [...]")
                  print(t[-queue:])
              print(flush=True)

          def fred(nom, sid, n=3):
              if not KEY:
                  print("## " + nom + " : pas de cle FRED"); return
              u = "https://api.stlouisfed.org/fred/series/observations?" + urllib.parse.urlencode(
                  {"series_id": sid, "api_key": KEY, "file_type": "json", "sort_order": "desc", "limit": n})
              st, ct, b = get(u)
              print("=" * 100)
              try:
                  obs = json.loads(b).get("observations", [])
                  print("## " + nom + " (" + sid + ") HTTP " + str(st) + " : " +
                        ", ".join(o["date"] + "=" + o["value"] for o in obs))
              except Exception as e:
                  print("## " + nom + " (" + sid + ") HTTP " + str(st) + " illisible " + str(e)[:80])
              u = "https://api.stlouisfed.org/fred/series?" + urllib.parse.urlencode(
                  {"series_id": sid, "api_key": KEY, "file_type": "json"})
              st, ct, b = get(u)
              try:
                  m = json.loads(b)["seriess"][0]
                  print("     " + m.get("title", "")[:90] + " | fin " + m.get("observation_end", "") +
                        " | maj " + m.get("last_updated", "") + " | " + m.get("frequency_short", ""))
              except Exception:
                  pass
              print(flush=True)

          print("######## A. TAUX DIRECTEURS ########")
          fred("Fed borne haute", "DFEDTARU")
          fred("BCE taux de depot", "ECBDFR")
          fred("BoJ (OCDE mensuel)", "IRSTCB01JPM156N")
          fred("BoE (mensuel)", "BOERUKM")
          montre("BCE API taux de depot", "https://data-api.ecb.europa.eu/service/data/FM/D.U2.EUR.4F.KR.DFR.LEV?lastNObservations=3&format=csvdata", tete=300, queue=400)
          montre("BoE IADB Bank Rate", "https://www.bankofengland.co.uk/boeapps/database/_iadb-fromshowcolumns.asp?csv.x=yes&Datefrom=01/Aug/2026&Dateto=now&SeriesCodes=IUDBEDR&CSVF=TN&UsingCodes=Y&VPD=Y&VFD=N", tete=300, queue=300)
          montre("BoC Valet cible", "https://www.bankofcanada.ca/valet/observations/V39079/json?recent=3", tete=900, queue=0)
          montre("RBA F1.1", "https://www.rba.gov.au/statistics/tables/csv/f1.1-data.csv", tete=1200, queue=600)
          montre("RBNZ B2 xlsx", "https://www.rbnz.govt.nz/-/media/project/sites/rbnz/files/statistics/series/b/b2/hb2-daily.xlsx", tete=0, queue=0)
          montre("SNB snboffzisa", "https://data.snb.ch/api/cube/snboffzisa/data/csv/en", tete=600, queue=500)
          montre("SNB snbgwdzid", "https://data.snb.ch/api/cube/snbgwdzid/data/csv/en", tete=600, queue=500)
          montre("BoJ API call", "https://www.stat-search.boj.or.jp/api/v1/getDataCode?format=json&lang=en&db=FM01&startDate=202608&code=STRDCLUCON", tete=900, queue=300)
          montre("BIS politique", "https://stats.bis.org/api/v2/data/dataflow/BIS/WS_CBPOL/1.0/D.US+XM+GB+JP+CH+CA+AU+NZ?startPeriod=2026-09-15&format=csv", tete=500, queue=1500)

          print("######## B. COURS DE CHANGE ########")
          montre("BCE EXR", "https://data-api.ecb.europa.eu/service/data/EXR/D.USD+JPY+GBP+CHF+CAD+AUD+NZD.EUR.SP00.A?lastNObservations=2&format=csvdata", tete=400, queue=1500)
          montre("BCE eurofxref", "https://www.ecb.europa.eu/stats/eurofxref/eurofxref-daily.xml", tete=1500, queue=0)

          print("######## C. PUBLICATIONS ########")
          montre("Eurostat HICP manr", "https://ec.europa.eu/eurostat/api/dissemination/statistics/1.0/data/prc_hicp_manr?geo=EA&coicop=CP00&lastTimePeriod=3", tete=1500, queue=0)
          montre("Eurostat HICP flash ei_cphi_m", "https://ec.europa.eu/eurostat/api/dissemination/statistics/1.0/data/ei_cphi_m?geo=EA&indic=CP-HI00&unit=RT12&lastTimePeriod=3", tete=1500, queue=0)
          montre("Eurostat chomage", "https://ec.europa.eu/eurostat/api/dissemination/statistics/1.0/data/une_rt_m?geo=EA20&age=TOTAL&sex=T&s_adj=SA&unit=PC_ACT&lastTimePeriod=3", tete=1500, queue=0)
          montre("ONS CPI D7G7", "https://www.ons.gov.uk/economy/inflationandpriceindices/timeseries/d7g7/mm23/data", tete=300, queue=700)
          montre("ONS chomage MGSX", "https://www.ons.gov.uk/employmentandlabourmarket/peoplenotinwork/unemployment/timeseries/mgsx/lms/data", tete=300, queue=700)
          corps = json.dumps([{"vectorId": 41690973, "latestN": 13}, {"vectorId": 2062815, "latestN": 2}]).encode()
          montre("StatCan WDS", "https://www150.statcan.gc.ca/t1/wds/rest/getDataFromVectorsAndLatestNPeriods", data=corps, extra={"Content-Type": "application/json"}, tete=2500, queue=0)
          montre("ABS LF chomage", "https://data.api.abs.gov.au/rest/data/ABS,LF,1.0.0/M13.3.1599.20.AUS.M?startPeriod=2026-06&format=csv", tete=600, queue=600)
          montre("ABS dataflows CPI", "https://data.api.abs.gov.au/rest/dataflow/ABS/CPI_M", tete=1500, queue=0)
          montre("SNB IPC plkopr", "https://data.snb.ch/api/cube/plkopr/data/csv/en", tete=500, queue=500)
          fred("Japon IPC OCDE", "JPNCPIALLMINMEI")
          fred("Japon IPC glissement", "CPALTT01JPM659N")
          montre("Nasdaq calendrier", "https://api.nasdaq.com/api/calendar/economicevents?date=2026-09-29", extra={"Accept": "application/json, text/plain, */*", "Origin": "https://www.nasdaq.com", "Referer": "https://www.nasdaq.com/"}, tete=2500, queue=0)
          PYEOF
