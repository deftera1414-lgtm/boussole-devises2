name: Diagnostic des sources officielles

# Execution manuelle uniquement. Interroge chaque source candidate et imprime
# ce qu'elle renvoie, sans rien ecrire dans le depot. Sert a verifier qu'une
# source repond depuis les serveurs de GitHub avant de la brancher au robot.

on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  diagnostic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Interroger les sources
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: |
          python3 - <<'PYEOF'
          import json, os, urllib.request, urllib.parse, urllib.error
          KEY = os.environ.get("FRED_API_KEY", "").strip()
          UA = {"User-Agent": "Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/126.0 Safari/537.36",
                "Accept": "*/*", "Accept-Language": "en-US,en;q=0.8"}

          def get(url, data=None, extra=None):
              h = dict(UA)
              if extra:
                  h.update(extra)
              rq = urllib.request.Request(url, data=data, headers=h)
              try:
                  with urllib.request.urlopen(rq, timeout=25) as r:
                      b = r.read()
                      return r.status, r.headers.get("Content-Type", ""), b
              except urllib.error.HTTPError as e:
                  return e.code, "", e.read()[:300]
              except Exception as e:
                  return 0, "", str(e).encode()

          def montre(nom, url, data=None, extra=None, tete=700, queue=500):
              st, ct, b = get(url, data, extra)
              t = b.decode("utf-8", "replace")
              print("=" * 100)
              print("## " + nom + "  ->  HTTP " + str(st) + "  " + ct + "  " + str(len(b)) + " octets")
              if tete:
                  print(t[:tete])
              if queue and len(t) > tete:
                  print("   [...]")
                  print(t[-queue:])
              print(flush=True)

          def fred(nom, sid, n=3):
              if not KEY:
                  print("## " + nom + " : pas de cle FRED"); return
              u = "https://api.stlouisfed.org/fred/series/observations?" + urllib.parse.urlencode(
                  {"series_id": sid, "api_key": KEY, "file_type": "json", "sort_order": "desc", "limit": n})
              st, ct, b = get(u)
              print("=" * 100)
              try:
                  obs = json.loads(b).get("observations", [])
                  print("## " + nom + " (" + sid + ") HTTP " + str(st) + " : " +
                        ", ".join(o["date"] + "=" + o["value"] for o in obs))
              except Exception as e:
                  print("## " + nom + " (" + sid + ") HTTP " + str(st) + " illisible " + str(e)[:80])
              u = "https://api.stlouisfed.org/fred/series?" + urllib.parse.urlencode(
                  {"series_id": sid, "api_key": KEY, "file_type": "json"})
              st, ct, b = get(u)
              try:
                  m = json.loads(b)["seriess"][0]
                  print("     " + m.get("title", "")[:90] + " | fin " + m.get("observation_end", "") +
                        " | maj " + m.get("last_updated", "") + " | " + m.get("frequency_short", ""))
              except Exception:
                  pass
              print(flush=True)

          print("######## NASDAQ ########")
          PAYS = {"United States", "Euro Zone", "Germany", "United Kingdom", "Japan", "Switzerland",
                  "Canada", "Australia", "New Zealand"}
          for jour in ("2026-09-24", "2026-09-29", "2026-09-30", "2026-09-17"):
              st, ct, b = get("https://api.nasdaq.com/api/calendar/economicevents?date=" + jour,
                              extra={"Accept": "application/json, text/plain, */*",
                                     "Origin": "https://www.nasdaq.com", "Referer": "https://www.nasdaq.com/"})
              print("=" * 100)
              try:
                  d = json.loads(b)["data"]
                  lignes = d.get("rows") or []
                  print("## Nasdaq " + jour + " HTTP " + str(st) + " asOf=" + str(d.get("asOf")) + " : " + str(len(lignes)) + " lignes")
                  for x in lignes:
                      if x.get("country") in PAYS:
                          print("   " + " | ".join(str(x.get(k, "")).replace("&nbsp;", "").strip()
                                                    for k in ("gmt", "country", "eventName", "actual", "consensus", "previous")))
              except Exception as e:
                  print("## Nasdaq " + jour + " illisible : " + str(e)[:120] + " " + b[:200].decode("utf-8", "replace"))
              print(flush=True)

          print("######## COMPLEMENTS ########")
          montre("RBA F1 quotidien", "https://www.rba.gov.au/statistics/tables/csv/f1-data.csv", tete=900, queue=0)
          st, ct, b = get("https://www.rba.gov.au/statistics/tables/csv/f1-data.csv")
          t = [l for l in b.decode("utf-8", "replace").splitlines() if l.strip().strip(",")]
          print("   dernieres lignes non vides RBA F1 :")
          for l in t[-4:]:
              print("   " + l[:160])
          montre("Eurostat chomage EA21", "https://ec.europa.eu/eurostat/api/dissemination/statistics/1.0/data/une_rt_m?geo=EA21&age=TOTAL&sex=T&s_adj=SA&unit=PC_ACT&lastTimePeriod=2", tete=600, queue=0)
          st, ct, b = get("https://ec.europa.eu/eurostat/api/dissemination/statistics/1.0/data/ei_cphi_m?geo=EA&unit=RT12&lastTimePeriod=1")
          try:
              j = json.loads(b)
              print("## ei_cphi_m indic disponibles : " + ", ".join(list(j["dimension"]["indic"]["category"]["index"])[:40]))
              print("   valeurs : " + json.dumps(j.get("value"))[:300])
          except Exception as e:
              print("## ei_cphi_m illisible " + str(e)[:100])
          st, ct, b = get("https://stats.bis.org/api/v2/data/dataflow/BIS/WS_CBPOL/1.0/D.NZ+AU+JP+CH?startPeriod=2026-09-01&format=csv")
          dern = {}
          for l in b.decode("utf-8", "replace").splitlines():
              p = l.split(",")
              if len(p) > 3 and p[0] == "D":
                  import re as _re
                  m = _re.search(r",(20\d\d-\d\d-\d\d),([-\d.]+),", l)
                  if m:
                      dern[p[1]] = m.group(1) + "=" + m.group(2)
          print("## BIS derniers points : " + json.dumps(dern))
          PYEOF
